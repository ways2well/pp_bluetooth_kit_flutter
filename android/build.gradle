
group 'com.example.pp_bluetooth_kit_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {

        maven { url 'https://maven.aliyun.com/mvn/search' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }

        maven { url "https://raw.githubusercontent.com/LefuHengqi/PPBaseKit-Android/main" }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {

        maven { url 'https://maven.aliyun.com/mvn/search' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }

        maven { url "https://raw.githubusercontent.com/LefuHengqi/PPBaseKit-Android/main" }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 34

    namespace 'com.example.pp_bluetooth_kit_flutter'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    //https://github.com/LefuHengqi/PPBaseKit-Android
    // Ways2Well fork: upstream pins 4.2.1.1, which inlines its Android BLE
    // transport (com.lefu.bluetooth.library) and subscribes to notifications on
    // characteristic fff1. The CF597 carries no 0x2902 descriptor on fff1 — it
    // notifies on fff4 — so the subscription fails ("getDescriptor for notify
    // null!") and the scale drops the link before any weight is delivered.
    // 4.6.20 moves that transport out to com.lefu:bluetoothkit:1.5.5, which
    // subscribes to fff4 correctly. See FORK.md.
    // iOS is unaffected — it uses the vendored xcframeworks, not these AARs.
    //基础模块，必须/Basic module, must
    api 'com.lefu.ppbasekit:ppbasekit:4.6.20'
    //蓝牙协议模块，集成设备和解析体重信息/Bluetooth protocol module, integrating devices and parsing weight information
    api 'com.lefu.ppbluetoothkit:ppbluetoothkit:4.6.20'
    //体脂计算库，根据需要引入/Body fat calculation library, introduced as needed
//    api 'com.lefu.ppcalculatekit:ppcalculatekit:4.6.20'



}

